name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Test & build webview
        working-directory: webview
        run: |
          npm ci
          npm test
          npm run build

      - name: Build documentation site
        working-directory: docs
        run: |
          npm ci
          npm run build

      - name: Run Gradle test suite, CLI distributions & build IntelliJ plugin
        run: ./gradlew test :arcdrift-cli:installDist :arcdrift-cli:jlinkDistTar :arcdrift-intellij:buildPlugin

      - name: Smoke-test zero-JRE standalone CLI
        run: |
          mkdir -p smoke
          tar -xzf cli/build/distributions/arc-standalone-*-linux-x86_64.tar.gz -C smoke
          ./smoke/arc/bin/arc --version
          ./smoke/arc/bin/arc scan core --format json > /dev/null

  action:
    name: GitHub Action (local build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Run ArcDrift action against this repository
        id: arcdrift
        uses: ./
        with:
          arc-version: local
          directory: core
          format: sarif
          output: arcdrift.sarif
          fail-on-drift: "false"

      - name: Verify action outputs
        run: |
          test -f "${{ steps.arcdrift.outputs.report-path }}"
          echo "passed=${{ steps.arcdrift.outputs.passed }}"
